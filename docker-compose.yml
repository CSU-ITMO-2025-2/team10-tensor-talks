services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_store_db
      POSTGRES_USER: user_store
      POSTGRES_PASSWORD: user_store_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_store -d user_store_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  user-store-service:
    build:
      context: ./backend/user-store-service
    environment:
      USER_STORE_DATABASE_HOST: postgres
      USER_STORE_DATABASE_PORT: "5432"
      USER_STORE_DATABASE_USER: user_store
      USER_STORE_DATABASE_PASSWORD: user_store_password
      USER_STORE_DATABASE_NAME: user_store_db
      USER_STORE_DATABASE_SSL_MODE: disable
      USER_STORE_SERVER_HOST: "0.0.0.0"
      USER_STORE_SERVER_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      AUTH_SERVER_HOST: "0.0.0.0"
      AUTH_SERVER_PORT: "8081"
      AUTH_USER_STORE_BASE_URL: http://user-store-service:8082
      AUTH_USER_STORE_TIMEOUT_SECONDS: "5"
      AUTH_JWT_SECRET: supersecretjwtkey
      AUTH_JWT_ACCESS_TOKEN_TTL: 15m
      AUTH_JWT_REFRESH_TOKEN_TTL: 720h
      AUTH_JWT_ISSUER: tensor-talks-auth
      AUTH_JWT_AUDIENCE: tensor-talks-services
    depends_on:
      user-store-service:
        condition: service_started
    ports:
      - "8081:8081"

  session-service:
    build:
      context: ./backend/session-service
    environment:
      SESSION_SERVER_HOST: "0.0.0.0"
      SESSION_SERVER_PORT: "8083"
    ports:
      - "8083:8083"

  bff-service:
    build:
      context: ./backend/bff-service
    environment:
      BFF_SERVER_HOST: "0.0.0.0"
      BFF_SERVER_PORT: "8080"
      BFF_AUTH_SERVICE_BASE_URL: http://auth-service:8081
      BFF_AUTH_SERVICE_TIMEOUT_SECONDS: "5"
      BFF_SESSION_SERVICE_BASE_URL: http://session-service:8083
      BFF_SESSION_SERVICE_TIMEOUT_SECONDS: "5"
      BFF_KAFKA_BROKERS: kafka:9092
      BFF_KAFKA_TOPIC_CHAT_OUT: chat.events.out
      BFF_KAFKA_TOPIC_CHAT_IN: chat.events.in
      BFF_KAFKA_CONSUMER_GROUP: bff-service-group
      BFF_CORS_ALLOW_ORIGINS: "*"
      BFF_CORS_ALLOW_HEADERS: Authorization,Content-Type
    depends_on:
      auth-service:
        condition: service_started
      session-service:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      bff-service:
        condition: service_started
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - bff-service
      - user-store-service
      - session-service
      - mock-model-service

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      SERVER_PORT: 9000
      JVM_OPTS: "-Xms32M -Xmx64M"
    ports:
      - "9000:9000"
    depends_on:
      - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
      - "9092:9092"

  mock-model-service:
    build:
      context: ./backend/mock-model-service
    environment:
      MOCK_MODEL_SERVER_HOST: "0.0.0.0"
      MOCK_MODEL_SERVER_PORT: "8084"
      MOCK_MODEL_KAFKA_BROKERS: kafka:9092
      MOCK_MODEL_KAFKA_TOPIC_CHAT_OUT: chat.events.out
      MOCK_MODEL_KAFKA_TOPIC_CHAT_IN: chat.events.in
      MOCK_MODEL_KAFKA_CONSUMER_GROUP: mock-model-service-group
      MOCK_MODEL_MODEL_MAX_QUESTIONS: "5"
      MOCK_MODEL_MODEL_QUESTION_DELAY_SECONDS: "2"
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8084:8084"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  dialogue-aggregator:
    build:
      context: ./backend/dialogue-aggregator
    environment:
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_PUBLICATION: dialogue-aggregator-publication-group
      KAFKA_CONSUMER_GROUP_MESSAGES: dialogue-aggregator-messages-group
      KAFKA_CONSUMER_GROUP_GENERATED: dialogue-aggregator-generated-group
      KAFKA_TOPIC_PUBLICATION: publication.events
      KAFKA_TOPIC_MESSAGES: messages.events
      KAFKA_TOPIC_GENERATED: generated.phrases
      KAFKA_TOPIC_FULL_DATA: messages.full.data
      KAFKA_TOPIC_HISTORY: history.full.events
      KAFKA_TOPIC_DLQ: dialogue-aggregator.dlq
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 100
      KAFKA_PRODUCER_ACKS: all
      KAFKA_PRODUCER_RETRIES: 3
      KAFKA_PRODUCER_COMPRESSION_TYPE: snappy
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
      REDIS_MAX_CONNECTIONS: 50
      REDIS_DIALOGUE_TTL_SECONDS: 86400
      REDIS_MESSAGES_CACHE_SIZE: 50
      # Service
      SERVICE_NAME: dialogue-aggregator
      SERVICE_VERSION: 1.0.0
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      MAX_MESSAGES_CACHE_SIZE: 50
      # Metrics
      METRICS_PORT: 9091
      ENABLE_PROMETHEUS: "true"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8085:8085"  # FastAPI app
      - "9091:9091"  # Metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  redis_data:

