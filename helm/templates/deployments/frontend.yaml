{{- if (index .Values.services "frontend").enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tensor-talks.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tensor-talks.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ (index .Values.services "frontend").replicaCount }}
  selector:
    matchLabels:
      {{- include "tensor-talks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "tensor-talks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        team: team10
        project: tensor-talks
    spec:
      serviceAccountName: {{ include "tensor-talks.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      initContainers:
        - name: nginx-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /var/cache/nginx/client_temp
              mkdir -p /var/cache/nginx/proxy_temp
              mkdir -p /var/cache/nginx/fastcgi_temp
              mkdir -p /var/cache/nginx/uwsgi_temp
              mkdir -p /var/cache/nginx/scgi_temp
              chown -R 101:101 /var/cache/nginx
              chmod -R 755 /var/cache/nginx
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/{{ (index .Values.services "frontend").image.repository }}:{{ (index .Values.services "frontend").image.tag }}"
          imagePullPolicy: Always
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            {{- toYaml (index .Values.services "frontend").resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "tensor-talks.fullname" . }}-frontend-nginx
        - name: nginx-cache
          emptyDir: {}
{{- end }}

