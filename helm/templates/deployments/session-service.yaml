{{- if .Values.services.session-service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tensor-talks.fullname" . }}-session-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tensor-talks.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-service
spec:
  replicas: {{ .Values.services.session-service.replicaCount }}
  selector:
    matchLabels:
      {{- include "tensor-talks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: session-service
  template:
    metadata:
      labels:
        {{- include "tensor-talks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: session-service
        team: team10
        project: tensor-talks
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "tensor-talks.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: session-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.session-service.image.repository }}:{{ .Values.services.session-service.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: SESSION_SERVER_HOST
              value: "0.0.0.0"
            - name: SESSION_SERVER_PORT
              value: "8083"
            - name: SESSION_REDIS_ADDR
              value: "{{ include "tensor-talks.fullname" . }}-redis:6379"
            - name: SESSION_REDIS_PASSWORD
              value: ""
            - name: SESSION_REDIS_DB
              value: "0"
            - name: SESSION_REDIS_TTL_HOURS
              value: "24"
            - name: SESSION_SESSION_CRUD_BASE_URL
              value: "http://{{ include "tensor-talks.fullname" . }}-session-crud-service:8085"
            - name: SESSION_SESSION_CRUD_TIMEOUT_SECONDS
              value: "5"
            - name: SESSION_KAFKA_BROKERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: SESSION_KAFKA_TOPIC_REQUEST
              value: "team10-interview.build.request"
            - name: SESSION_KAFKA_TOPIC_RESPONSE
              value: "team10-interview.build.response"
            - name: SESSION_KAFKA_CONSUMER_GROUP
              value: "team10-session-manager-service-group"
            - name: SESSION_SESSION_MANAGER_MAX_ACTIVE_SESSIONS
              value: "100"
            - name: SESSION_SESSION_MANAGER_PROGRAM_TIMEOUT_SECONDS
              value: "30"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.services.session-service.resources | nindent 12 }}
{{- end }}

