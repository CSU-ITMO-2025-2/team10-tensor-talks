{{- if .Values.services.session-crud-service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tensor-talks.fullname" . }}-session-crud-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tensor-talks.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-crud-service
spec:
  replicas: {{ .Values.services.session-crud-service.replicaCount }}
  selector:
    matchLabels:
      {{- include "tensor-talks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: session-crud-service
  template:
    metadata:
      labels:
        {{- include "tensor-talks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: session-crud-service
        team: team10
        project: tensor-talks
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "tensor-talks.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: session-crud-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.session-crud-service.image.repository }}:{{ .Values.services.session-crud-service.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          env:
            - name: SESSION_CRUD_SERVER_HOST
              value: "0.0.0.0"
            - name: SESSION_CRUD_SERVER_PORT
              value: "8085"
            - name: SESSION_CRUD_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-talks.fullname" . }}-postgres
                  key: host
            - name: SESSION_CRUD_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-talks.fullname" . }}-postgres
                  key: port
            - name: SESSION_CRUD_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-talks.fullname" . }}-postgres
                  key: user
            - name: SESSION_CRUD_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-talks.fullname" . }}-postgres
                  key: password
            - name: SESSION_CRUD_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-talks.fullname" . }}-postgres
                  key: database
            - name: SESSION_CRUD_DATABASE_SSL_MODE
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-talks.fullname" . }}-postgres
                  key: sslmode
            - name: SESSION_CRUD_DATABASE_SCHEMA
              value: {{ .Values.services.session-crud-service.database.schema | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.services.session-crud-service.resources | nindent 12 }}
{{- end }}

