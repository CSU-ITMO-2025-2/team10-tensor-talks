{{- if .Values.vault.enabled }}
# ExternalSecret для PostgreSQL credentials из Vault
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tensor-talks.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tensor-talks.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "tensor-talks.fullname" . }}-vault-backend
    kind: SecretStore
  target:
    name: {{ include "tensor-talks.fullname" . }}-postgres
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: {{ .Values.vault.postgresql.path | default "team10/postgresql" }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ .Values.vault.postgresql.path | default "team10/postgresql" }}
        property: port
    - secretKey: database
      remoteRef:
        key: {{ .Values.vault.postgresql.path | default "team10/postgresql" }}
        property: database
    - secretKey: user
      remoteRef:
        key: {{ .Values.vault.postgresql.path | default "team10/postgresql" }}
        property: user
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.postgresql.path | default "team10/postgresql" }}
        property: password
    - secretKey: sslmode
      remoteRef:
        key: {{ .Values.vault.postgresql.path | default "team10/postgresql" }}
        property: sslmode

---
# ExternalSecret для JWT secrets из Vault
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tensor-talks.fullname" . }}-jwt
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tensor-talks.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "tensor-talks.fullname" . }}-vault-backend
    kind: SecretStore
  target:
    name: {{ include "tensor-talks.fullname" . }}-jwt
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: {{ .Values.vault.jwt.path | default "team10/jwt" }}
        property: secret
    - secretKey: issuer
      remoteRef:
        key: {{ .Values.vault.jwt.path | default "team10/jwt" }}
        property: issuer
    - secretKey: audience
      remoteRef:
        key: {{ .Values.vault.jwt.path | default "team10/jwt" }}
        property: audience

---
# ExternalSecret для Grafana admin password из Vault
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tensor-talks.fullname" . }}-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tensor-talks.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "tensor-talks.fullname" . }}-vault-backend
    kind: SecretStore
  target:
    name: {{ include "tensor-talks.fullname" . }}-grafana
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.vault.grafana.path | default "team10/grafana" }}
        property: admin-password
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.vault.grafana.path | default "team10/grafana" }}
        property: admin-user

---
# SecretStore для подключения к Vault
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "tensor-talks.fullname" . }}-vault-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tensor-talks.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | default "https://vault.kubepractice.ru" }}
      path: {{ .Values.vault.path | default "secret" }}
      version: {{ .Values.vault.version | default "v2" }}
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.auth.mountPath | default "kubernetes" }}
          role: {{ .Values.vault.auth.role | default "team10" }}
          serviceAccountRef:
            name: {{ include "tensor-talks.serviceAccountName" . }}
{{- end }}

