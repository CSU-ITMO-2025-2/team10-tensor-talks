# Конфигурация Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: tensor-talks-team10.kubepractice.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - tensor-talks-team10.kubepractice.ru
      secretName: tls-secret

# ServiceMonitor для Prometheus
# ВНИМАНИЕ: Требуются права на создание ресурсов в namespace 'monitoring'
# Если прав нет, установите enabled: false и попросите администратора создать ServiceMonitor вручную
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 60s  # Увеличено до 60s для снижения нагрузки на общий Prometheus
  scrapeTimeout: 10s
  # Ограничения для предотвращения засорения общих систем
  maxMetrics: 100  # Максимум метрик на сервис (через metricRelabelings)

# ServiceAccount
serviceAccount:
  create: true
  annotations: {}

# Контекст безопасности Pod
podSecurityContext:
  fsGroup: 2000

# Контекст безопасности
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

