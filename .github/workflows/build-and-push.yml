name: Сборка и публикация Docker образов

on:
  push:
    branches:
      - Kuber
  pull_request:
    branches:
      - Kuber
  workflow_dispatch:  # Позволяет запускать вручную

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: csu-itmo-2025-2/team10-tensor-talks
  ENABLE_PUSH: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - auth-service
          - bff-service
          - user-store-service
          - session-service
          - session-crud-service
          - chat-crud-service
          - results-crud-service
          - knowledge-base-crud-service
          - questions-crud-service
          - interview-builder-service
          - knowledge-producer-service
          - mock-model-service
          - frontend

    steps:
      - name: Клонирование кода
        uses: actions/checkout@v4

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Извлечение метаданных
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Сборка и публикация Docker образа
        if: matrix.service != 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сборка и публикация frontend
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Информация о сборке
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "✅ Образ ${{ matrix.service }} успешно собран (без публикации, это PR)"
          else
            echo "✅ Образ ${{ matrix.service }} успешно собран и опубликован в ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest"
          fi

